<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CP 鉴定所 2.1 · 校准版</title>
<style>
  html{background:#ffffff;color-scheme:light}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:#ffffff;
    color:#3a2442;min-height:100vh;overflow-x:hidden;position:relative;
  }
  .bg-hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg-hearts span{position:absolute;bottom:-60px;opacity:0;animation:floatUp linear infinite}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg);opacity:0}
    10%{opacity:.5} 90%{opacity:.12}
    100%{transform:translateY(-115vh) rotate(28deg);opacity:0}
  }
  .card{position:relative;z-index:1;max-width:540px;margin:40px auto 60px;padding:32px 28px 26px;
    background:#ffffff;border:1px solid #f3d6e4;border-radius:26px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 20px 50px rgba(214,51,108,.12)}
  h1{font-size:32px;text-align:center;letter-spacing:2px;
    background:linear-gradient(120deg,#ff6ea9,#ff4d79 45%,#ff9a3c 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{text-align:center;color:#8a6f86;margin-top:8px;font-size:14px;letter-spacing:1px}
  .tags{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tags span{font-size:11px;padding:4px 10px;border-radius:999px;color:#a0607f;
    background:#fff0f6;border:1px solid #f5cfe0;letter-spacing:1px}
  .input-row{display:flex;align-items:center;gap:12px;margin-top:22px}
  .input-row input{flex:1;min-width:0;padding:14px;border-radius:14px;border:1px solid #f0c4d8;
    background:#fff;color:#3a2442;font-size:16px;outline:none;transition:.25s;text-align:center}
  .input-row input:focus{border-color:#ff7eb3;box-shadow:0 0 0 3px rgba(255,126,179,.2)}
  .input-row input::placeholder{color:#c9a6b8}
  .x{color:#ff4d79;font-size:20px;font-weight:700;flex:none}
  .go-btn{width:100%;margin-top:18px;padding:15px;border:none;border-radius:16px;cursor:pointer;
    font-size:17px;font-weight:700;letter-spacing:3px;color:#fff;
    background:linear-gradient(120deg,#ff6ea9,#ff4d79 55%,#ff8a5c);
    box-shadow:0 8px 24px rgba(255,77,121,.3);transition:.25s}
  .go-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,77,121,.42)}
  .go-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#fff;color:#3a2442;border:1px solid #f0b3cf;padding:10px 18px;border-radius:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.08);font-size:14px;transition:.3s;z-index:9;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .result{margin-top:22px}
  .hidden{display:none!important}
  .scan{text-align:center;padding:26px 0 12px}
  .scan-icon{font-size:42px;animation:wob 1s ease-in-out infinite;display:inline-block}
  @keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.15)}}
  .scan-text{margin-top:14px;color:#7a5f73;font-size:15px;letter-spacing:1px}
  .scan-text::after{content:'';animation:dots 1.2s steps(1) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  .verdict{animation:fadeUp .5s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .cp-badge{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px}
  .cp-name{padding:8px 18px;border-radius:999px;font-weight:700;font-size:16px;letter-spacing:1px;color:#a0245c;
    background:linear-gradient(120deg,#ffe0ec,#ffe9dc);
    border:1px solid #f5a3c6}
  .cp-type{font-size:13px;color:#7a5f73;padding:6px 12px;border-radius:999px;
    background:#fbf3f8;border:1px solid #f0d9e6}
  .gauge-wrap{position:relative;width:200px;margin:22px auto 6px}
  .gauge{display:block;transform:rotate(-90deg)}
  .gauge .track{fill:none;stroke:#f6e3ec;stroke-width:12}
  .gauge .fill{fill:none;stroke:url(#gaugeGrad);stroke-width:12;stroke-linecap:round;
    stroke-dasharray:477.52;stroke-dashoffset:477.52;
    transition:stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1);
    filter:drop-shadow(0 0 6px rgba(255,110,169,.35))}
  .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .score-num b{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
    background:linear-gradient(160deg,#ff4d79,#ff9a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
  .score-num small{margin-top:6px;font-size:12px;color:#8a6f86;letter-spacing:5px}
  .tier{text-align:center;margin-top:10px;font-size:18px;font-weight:700;letter-spacing:1px}
  .chips{margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:12px;color:#8a6f86}
  .chips span{padding:5px 11px;border-radius:999px;color:#b0306a;
    background:#fff0f6;border:1px solid #f5b8d2}
  .bars{margin:22px auto 0;max-width:370px;display:flex;flex-direction:column;gap:12px}
  .bar-row{display:flex;align-items:center;gap:10px;font-size:13px}
  .bar-label{width:76px;color:#7a5f73;flex:none;text-align:right}
  .bar-track{flex:1;height:10px;border-radius:999px;background:#f6e6ee;overflow:hidden}
  .bar-fill{height:100%;width:0;border-radius:999px;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
  .bar-val{width:30px;flex:none;font-weight:600;font-variant-numeric:tabular-nums;color:#3a2442}
  .rules{margin:22px auto 0;max-width:400px;background:#fdf7fa;border:1px solid #f3d6e4;
    border-radius:14px;padding:4px 14px 8px}
  .sum-line{font-size:12px;color:#8a6f86;text-align:center;padding:10px 0 2px;letter-spacing:.5px}
  .rule-row{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #efd6e2}
  .rule-row:last-child{border-bottom:none}
  .rule-ico{flex:none;width:18px;text-align:center;font-size:12px}
  .rule-body{flex:1;line-height:1.5}
  .rule-title{font-weight:600;font-size:12.5px}
  .rule-desc{color:#8a6f86;font-size:11.5px;margin-top:1px}
  .rule-pts{flex:none;font-weight:700;color:#d6336c;font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
  .rule-pts.zero{color:#c9b3c0}
  .rule-pts.skip{color:#c9b3c0;font-weight:400}
  .quote{margin:20px auto 0;max-width:400px;padding:14px 18px;border-radius:14px;
    background:#fff7fb;border:1px dashed #f0b3cf;
    text-align:center;font-size:14px;color:#5a3d55;line-height:1.7}
  .again-btn{display:block;margin:20px auto 0;padding:11px 28px;border-radius:999px;cursor:pointer;
    background:transparent;color:#d6336c;border:1px solid #f0a6c4;font-size:14px;transition:.25s}
  .again-btn:hover{background:#fff0f6}
  .footnote{margin-top:18px;text-align:center;font-size:11px;color:#b39aab;letter-spacing:1px;line-height:1.8}
  .history{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .h-chip{font-size:12px;padding:5px 11px;border-radius:999px;background:#fff7fb;
    border:1px solid #f3d6e4;color:#7a5f73}
  .h-chip b{color:#d6336c}
  .burst{position:absolute;pointer-events:none;font-size:18px;animation:burstUp 1.6s ease-out forwards;z-index:5}
  @keyframes burstUp{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),-90px) scale(1.25)}}
  @media (max-width:520px){
    .card{margin:16px 12px 40px;padding:26px 16px}
    h1{font-size:27px}.bar-label{width:66px}
  }
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<main class="card">
  <h1>💕 CP 鉴定所 2.1</h1>
  <p class="sub">不摇骰子 · 按名字本身判 · 每一分都有出处</p>
  <div class="tags">
    <span>📜 全规则判定</span><span>🎲 零随机</span><span>⚖️ v2.1 分布校准</span>
  </div>

  <section class="input-row">
    <input id="nameA" maxlength="10" placeholder="名字 A">
    <div class="x">×</div>
    <input id="nameB" maxlength="10" placeholder="名字 B">
  </section>

  <button class="go-btn" id="goBtn">开 始 鉴 定 🔍</button>

  <section class="result hidden" id="result">
    <div class="scan" id="scan">
      <div class="scan-icon">📜</div>
      <div class="scan-text" id="scanText">正在查阅发音字典</div>
    </div>

    <div class="verdict hidden" id="verdict">
      <div class="cp-badge">
        <span class="cp-name">CP 名：<span id="cpName"></span></span>
        <span class="cp-type" id="cpType"></span>
      </div>

      <div class="gauge-wrap" id="gaugeWrap">
        <svg class="gauge" viewBox="0 0 180 180">
          <defs>
            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffb86b"/>
              <stop offset="55%" stop-color="#ff5f8f"/>
              <stop offset="100%" stop-color="#ff9dc3"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="90" cy="90" r="76"/>
          <circle class="fill" id="gaugeFill" cx="90" cy="90" r="76"/>
        </svg>
        <div class="score-num"><b id="scoreNum">0</b><small>好磕指数</small></div>
      </div>

      <div class="tier" id="tier"></div>
      <div class="chips" id="chips"></div>

      <div class="bars">
        <div class="bar-row"><div class="bar-label">音韵契合</div><div class="bar-track"><div class="bar-fill"></div></div><div class="bar-val">0</div></div>
        <div class="bar-row"><div class="bar-label">意境缘分</div><div class="bar-track"><div class="bar-fill"></div></div><div class="bar-val">0</div></div>
        <div class="bar-row"><div class="bar-label">氛围张力</div><div class="bar-track"><div class="bar-fill"></div></div><div class="bar-val">0</div></div>
      </div>

      <div class="rules">
        <div class="sum-line" id="sumLine"></div>
        <div id="rulesList"></div>
      </div>

      <div class="quote" id="quote"></div>
      <button class="again-btn" id="againBtn">再测一对 🔁</button>
    </div>
  </section>

  <div class="history" id="history"></div>

  <p class="footnote">✦ 本页没有一处 Math.random · v2.1 校准：普通对 ≈ 38，天选对 90+ ✦
✦ 生僻字查无此字会如实标注「无法判定」，绝不蒙混过关 ✦</p>
</main>

<div class="toast" id="toast"></div>

const FAM={"a":"a","ia":"a","ua":"a","o":"o","uo":"o","e":"o","ie":"ie","ue":"ie","ai":"ai","uai":"ai",

"g":"舌根音","k":"舌根音","h":"舌根音","j":"舌面音","q":"舌面音","x":"舌面音","zh":"翘舌音","ch":"翘舌音","sh":"翘舌音","r":"翘舌音",

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function scriptOf(arr){
  let l=0,c=0;
  for(const ch of arr){ if(/[a-z]/i.test(ch))l++; else if(/[\u4e00-\u9fff]/.test(ch))c++; }
  if(l&&c)return"mixed"; if(l)return"latin"; if(c)return"cjk"; return"other";
}
function findElem(arr){
  for(let i=arr.length-1;i>=0;i--){ const e=PY[arr[i]]; if(e)return [e[3],arr[i]]; }
  return null;
}

function typeOf(f){
  if(f.self)return"自磕型 🪞";
  if(f.palindrome)return"命定型 💫";
  if(f.overcome)return"宿敌型 ⚔️";
  if(f.rhyme)return"灵魂共鸣型 🎻";

  return"慢热型 🐌";
}

/* ================= 规则引擎（核心，零随机） ================= */
function analyzeNames(rawA,rawB){
  const A=[...rawA.replace(/\s+/g,'')], B=[...rawB.replace(/\s+/g,'')];
  const nA=rawA.trim(), nB=rawB.trim();
  const sA=scriptOf(A), sB=scriptOf(B);
  const rows=[]; const f={self:false,palindrome:false,overcome:false,generate:false,sameE:false,rhyme:false,shared:0,cross:false,sameSurname:false,distinct:0,latinInit:false};
  let total=0;
  const add=(group,title,pts,max,skip,detail)=>{rows.push({group,title,pts,max,skip,detail});total+=pts;};

  add('base','基础缘分',BASE,BASE,false,'两个陌生人之间的初始善意，人人有份，童叟无欺');

  f.self = rawA.toLowerCase().replace(/\s+/g,'')===rawB.toLowerCase().replace(/\s+/g,'');

  /* --- 共有字（v2.1：16/字，上限32） --- */
  const setA=[...new Set(A.map(c=>c.toLowerCase()))];
  const shared=setA.filter(c=>B.some(x=>x.toLowerCase()===c));
  f.shared=shared.length;
  const sPts=Math.min(32,shared.length*16);
  add('imagery','共有缘分字',sPts,32,false,
    shared.length?`两人共有「${shared.join('')}」——名字里的同款，命运的暗号`:'没有任何共同字符——各自独立，互不打扰');

  /* --- 同姓 --- */
  f.sameSurname=!f.self&&A[0].toLowerCase()===B[0].toLowerCase();
  add('imagery','同姓之缘',f.sameSurname?6:0,6,false,
    f.sameSurname?`首字同为「${A[0]}」——五百年前一家人的既视感`:`「${A[0]}」和「${B[0]}」不同姓——素不相识，清清白白`);

  /* --- 长相般配（v2.1 降权：6/4/2） --- */
  const d=Math.abs(A.length-B.length);
  const lPts=[6,4,2][d]!==undefined?[6,4,2][d]:1;
  add('none','字数般配',lPts,6,false,
    d===0?`${A.length}字对${B.length}字——长度一致，站在一起天生一对`:
    d===1?`${A.length}字对${B.length}字，一字之差——正常落差`:
    `${A.length}字对${B.length}字——长短悬殊，视觉上欠点火候`);

  /* --- 镜像彩蛋 --- */
  f.palindrome=!f.self&&A.slice().reverse().join('')===B.join('');
  add('none','镜像彩蛋',f.palindrome?15:0,15,false,
    f.palindrome?'倒着读就是你——天造地设的回文联':'不是彼此的镜像');

  /* --- 发音类规则 --- */
  if(sA==='cjk'&&sB==='cjk'){
    const la=PY[A[A.length-1]], lb=PY[B[B.length-1]];
    if(la&&lb){
      const sameSyl=la[0]===lb[0]&&la[1]===lb[1]&&la[2]===lb[2];
      const rhyme=la[1]===lb[1];
      const famA=FAM[la[1]], famB=FAM[lb[1]];
      const near=!rhyme&&famA&&famB&&famA===famB;
      f.rhyme=rhyme||sameSyl||near;
      const py=s=>s[0]?s[0]+s[1]:s[1];
      /* v2.1：同音18 / 同韵15 / 近韵(同韵摄)8 */
      add('phonetic','押韵检测',sameSyl?18:rhyme?15:near?8:0,18,false,
        sameSyl?`尾字同为「${py(la)}」音——喊一个，俩人一起回头`:
        rhyme?`尾字同押「${la[1]}」韵——读起来顺口，CP 名都好起`:
        near?`同属「${famA}」韵摄（${la[1]}≈${lb[1]}）——半押韵，念着有点意思`:
        `韵母「${la[1]}」对「${lb[1]}」——不押韵，此路不通`);
    }else{
      const miss=[!la?A[A.length-1]:null,!lb?B[B.length-1]:null].filter(Boolean).join('」「');
      add('phonetic','押韵检测',0,18,true,`尾字「${miss}」不在内置字库（约350常用字），无法判定押韵`);
    }
    const fa=PY[A[0]], fb=PY[B[0]];
    if(fa&&fb){
      /* v2.1：同声母8 / 同发音部位5（新增） */
      const sameI=fa[0]===fb[0]&&fa[0]!=="";
      const sameP=PLACE[fa[0]]===PLACE[fb[0]];
      add('phonetic','双声检测',sameI?8:sameP?5:0,8,false,
        sameI?`首字同为「${fa[0]}」声母——双声词，CP 名自带节奏`:
        sameP?`首字声母同属${PLACE[fa[0]]}（${fa[0]||"零声母"}·${fb[0]||"零声母"}）——发音部位相同，念起来不打架`:
        `声母「${fa[0]||"零声母"}」对「${fb[0]||"零声母"}」——各说各话`);
    }else{
      add('phonetic','双声检测',0,8,true,'首字不在内置字库——无法判定双声');
    }
    const tones=new Set([...A,...B].map(c=>PY[c]&&PY[c][2]).filter(Boolean));
    f.distinct=tones.size;
    if(tones.size>0){
      /* v2.1：12/8/4/0 */
      const tPts={4:12,3:8,2:4,1:0}[tones.size];
      add('phonetic','声调起伏',tPts,12,false,
        tones.size===4?'四声齐全——平仄交错，像首情歌':
        tones.size===3?'三声交错——抑扬顿挫，有起伏':
        tones.size===2?'双声调重复——略单调，但胜在稳定':
        '全程一个调——波澜不惊，稳如老狗');
    }else{
      add('phonetic','声调起伏',0,12,true,'无字库内字符——无法分析声调');
    }
    const ea=findElem(A), eb=findElem(B);
    if(ea&&eb){
      let ePts,rel;
      /* v2.1：同8 / 生12 / 克4（相克降为小分，宿敌张力另算在氛围里） */
      if(ea[0]===eb[0]){ePts=8;f.sameE=true;rel=`同为「${ea[0]}」——同类共鸣，频道秒对上`;}
      else if(SHENG[ea[0]]===eb[0]){ePts=12;f.generate=true;rel=`${ea[0]}生${eb[0]}——${nA}滋养${nB}，养成系甜宠`;}
      else if(SHENG[eb[0]]===ea[0]){ePts=12;f.generate=true;rel=`${eb[0]}生${ea[0]}——${nB}点亮${nA}，双向奔赴`;}
      else if(KE[ea[0]]===eb[0]){ePts=4;f.overcome=true;rel=`${ea[0]}克${eb[0]}——相爱相杀，戏剧张力拉满`;}
      else{ePts=4;f.overcome=true;rel=`${eb[0]}克${ea[0]}——欢喜冤家，越克越上头`;}
      add('imagery','五行生克',ePts,12,false,`「${ea[1]}」属${ea[0]}，「${eb[1]}」属${eb[0]} · ${rel}`);
    }else{
      add('imagery','五行生克',0,12,true,'尾字五行属性未知——无法判定生克');
    }
  }else if(sA==='latin'&&sB==='latin'){
    add('phonetic','押韵检测',0,18,true,'中文专属规则，英文名跳过');
    add('phonetic','双声检测',0,8,true,'中文专属规则，英文名跳过');
    add('phonetic','声调起伏',0,12,true,'中文专属规则，英文名跳过');
    add('imagery','五行生克',0,12,true,'中文专属规则，英文名跳过');
    const initSame=A[0].toLowerCase()===B[0].toLowerCase();
    f.latinInit=initSame;
    const last2=A.length>2&&B.length>2&&A.slice(-2).join('').toLowerCase()===B.slice(-2).join('').toLowerCase();
    const pts=Math.min(12,shared.length*2+(initSame?6:0)+(last2?4:0));
    add('phonetic','英文音韵',pts,12,false,[
      initSame?`首字母同为「${A[0].toUpperCase()}」——字母情侣`:`首字母「${A[0].toUpperCase()}」对「${B[0].toUpperCase()}」`,
      shared.length?`共有字母：${shared.join(' ')}`:'无共有字母',
      last2?'结尾两字母押韵':''].filter(Boolean).join(' · '));
  }else{
    add('phonetic','押韵检测',0,18,true,'中英混搭，无法同台比较');
    add('phonetic','双声检测',0,8,true,'混搭语言，跳过');
    add('phonetic','声调起伏',0,12,true,'混搭语言，跳过');
    add('imagery','五行生克',0,12,true,'混搭语言，跳过');
  }

  /* --- 跨语言 --- */
  f.cross=(sA!==sB&&sA!=='other'&&sB!=='other')||sA==='mixed'||sB==='mixed';
  if(sA===sB&&sA!=='mixed'){
    add('none','跨语言加成',0,4,true,'同语种交流，走常规通道');
  }else{
    add('none','跨语言加成',f.cross?4:0,4,false,'一个中文一个西文——跨国恋氛围加成');
  }

  /* --- v2.2 新增踩分点 --- */
  const hasDup=arr=>arr.some((c,i)=>i>0&&arr[i-1]===c);
  const dupName=hasDup(A)?nA:hasDup(B)?nB:null;
  add('none','叠字可爱',dupName?6:0,6,false,
    dupName?`「${dupName}」含叠字——读起来自带撒娇语气`:'两个名字都没有叠字');
  const chain=!f.self&&(A[A.length-1]===B[0]||B[B.length-1]===A[0]);
  add('none','名字接龙',chain?8:0,8,false,
    chain?'一人的尾字正是另一人的首字——名字自己就在接话':'名字之间没有首尾接龙');
  const totalLen=A.length+B.length;
  add('none','字数凑整',totalLen===5?5:(totalLen===4||totalLen===6)?3:0,5,false,
    totalLen===5?`合计 5 字——黄金字数，念起来刚刚好`:
    (totalLen===4||totalLen===6)?`合计 ${totalLen} 字——偶数字数，工整对称`:`合计 ${totalLen} 字——字数不凑巧，不影响感情，但少了点仪式感`);
  if(sA==='cjk'&&sB==='cjk'){
    const hA=PY[A[0]], hB=PY[B[0]];
    if(hA&&hB){
      const ping=t=>t<=2;
      const comp=ping(hA[2])!==ping(hB[2]);
      add('phonetic','平仄互补',comp?5:0,5,false,
        comp?`首字一平一仄（${hA[2]}声 · ${hB[2]}声）——一高一低，有来有回`:
        `首字同为${ping(hA[2])?'平':'仄'}声——节奏一致，走同一条路线`);
      const homo=A[0]!==B[0]&&hA[0]===hB[0]&&hA[1]===hB[1]&&hA[2]===hB[2];
      add('phonetic','谐音彩蛋',homo?6:0,6,false,
        homo?`「${A[0]}」「${B[0]}」同音不同字——暗号式的谐音，懂的都懂`:'首字没有同音异字');
    }else{
      add('phonetic','平仄互补',0,5,true,'首字不在内置字库——无法判定平仄');
      add('phonetic','谐音彩蛋',0,6,true,'首字不在内置字库——无法判定谐音');
    }
  }else{
    add('phonetic','平仄互补',0,5,true,'中文专属规则，跳过');
    add('phonetic','谐音彩蛋',0,6,true,'中文专属规则，跳过');
  }

  /* --- v2.3 新增踩分点 --- */
  const IMG="月星云雨风雪山海光晨露霞雾";
  const imgA=[...new Set(A.filter(c=>IMG.includes(c)))], imgB=[...new Set(B.filter(c=>IMG.includes(c)))];
  const imgCommon=imgA.length&&imgB.length;
  add('none','意象共鸣',imgCommon?6:0,6,false,
    imgCommon?`双方都带有自然意象（${imgA.concat(imgB).filter((v,i,arr)=>arr.indexOf(v)===i).join('·')}）——诗意相通`:
    '名字里没有共享的自然意象字');
  if(sA==='cjk'&&sB==='cjk'){
    const lastA=PY[A[A.length-1]], lastB=PY[B[B.length-1]];
    const fA=PY[A[0]], fB=PY[B[0]];
    if(lastA&&lastB){
      const tailInit=lastA[0]!==""&&lastA[0]===lastB[0];
      add('phonetic','尾音呼应',tailInit?4:0,4,false,
        tailInit?`尾字声母同为「${lastA[0]}」——收尾的那一下，嗓音对上了`:'尾字声母不同，收尾各走各的');
      add('phonetic','同调收尾',lastA[2]===lastB[2]?3:0,3,false,
        lastA[2]===lastB[2]?`尾字同为${lastA[2]}声——句末的语气一致`:'尾字声调不同，句末一升一降');
    }else{
      add('phonetic','尾音呼应',0,4,true,'尾字不在内置字库——无法判定');
      add('phonetic','同调收尾',0,3,true,'尾字不在内置字库——无法判定');
    }
    if(fA&&fB){
      const headFin=fA[1]!==""&&fA[1]===fB[1];
      add('phonetic','首韵呼应',headFin&&A[0]!==B[0]?4:0,4,false,
        headFin&&A[0]!==B[0]?`首字同押「${fA[1]}」——开口的韵脚一模一样`:'首字韵母没有呼应');
    }else{
      add('phonetic','首韵呼应',0,4,true,'首字不在内置字库——无法判定');
    }
    const elems=new Set([...A,...B].map(c=>PY[c]&&PY[c][3]).filter(Boolean));
    if(elems.size>0){
      const ePts=elems.size===1?5:elems.size===2?2:0;
      add('imagery','五行同源',ePts,5,false,
        elems.size===1?`全部字符同属「${[...elems][0]}」——同一个五行里长大的`:
        elems.size===2?`涉及两种五行（${[...elems].join('·')}）——互补有余，同源不足`:
        '五行杂陈，各有各的根');
    }else{
      add('imagery','五行同源',0,5,true,'无字库内字符——无法判定五行');
    }
  }else{
    add('phonetic','尾音呼应',0,4,true,'中文专属规则，跳过');
    add('phonetic','同调收尾',0,3,true,'中文专属规则，跳过');
    add('phonetic','首韵呼应',0,4,true,'中文专属规则，跳过');
    add('imagery','五行同源',0,5,true,'中文专属规则，跳过');
  }

  /* --- v2.4 新增：首字母叠音 --- */
  /* 首字母：英文每个词取第一个字母；中文每个字取拼音声母（零声母取韵母首字母） */
  const firstInits=raw=>{
    const res=[];
    raw.trim().split(/\s+/).forEach(tok=>{
      let latinDone=false;
      [...tok].forEach(c=>{
        if(/[a-z]/i.test(c)){ if(!latinDone){res.push(c.toLowerCase());latinDone=true;} }
        else if(PY[c]){const e=PY[c];res.push(e[0]||(e[1]?e[1][0]:""));}
      });
    });
    return res.filter(Boolean);
  };
  const seqA=firstInits(rawA), seqB=firstInits(rawB);
  const combined=seqA.concat(seqB).join('');
  let squareFound=null;
  for(let p=2;p<=Math.floor(combined.length/2)&&!squareFound;p++){
    for(let i=0;i+2*p<=combined.length;i++){
      if(combined.substr(i,p)===combined.substr(i+p,p)){squareFound=combined.substr(i,p);break;}
    }
  }
  const sqPts=squareFound?6:0;
  add('phonetic','首字母叠音',sqPts,6,false,
    squareFound?`首字母连成「${combined.toUpperCase()}」，内含叠音「${squareFound.toUpperCase()}${squareFound.toUpperCase()}」——字母会自己跳舞`:
    combined?`首字母连成「${combined.toUpperCase()}」——没有连续的叠音`:'无法提取首字母');

  /* --- v2.5 新增踩分点 --- */
  if(sA==='cjk'&&sB==='cjk'){
    const endA=PY[A[A.length-1]], endB=PY[B[B.length-1]];
    const headA=PY[A[0]], headB=PY[B[0]];
    if(endA&&endB&&headA&&headB){
      const initChain=(endA[0]!==""&&endA[0]===headB[0])||(endB[0]!==""&&endB[0]===headA[0]);
      add('phonetic','声母接龙',initChain?4:0,4,false,
        initChain?'一人的尾字声母，正好是另一人首字的声母——声音在接力':'尾字与首字的声母没有接上');
      const finChain=endA[1]===headB[1]||endB[1]===headA[1];
      add('phonetic','韵母接龙',finChain?4:0,4,false,
        finChain?'一人的尾字韵母，与另一人的首字韵母相接——韵脚在传递':'尾字与首字的韵母没有接上');
      const sameTail=!f.self&&A[A.length-1]===B[B.length-1];
      add('imagery','同尾相守',sameTail?5:0,5,false,
        sameTail?`两人都以「${A[A.length-1]}」收尾——走到最后也是同一个字`:'两人的尾字不同');
      const nasal=/n$|ng$/.test(endA[1])&&/n$|ng$/.test(endB[1]);
      add('phonetic','鼻音共振',nasal?4:0,4,false,
        nasal?`尾字都带鼻音（${endA[1]} · ${endB[1]}）——嗡嗡地共振`:'至少一人的尾字不是鼻音收尾');
    }else{
      add('phonetic','声母接龙',0,4,true,'字库外字符——无法判定');
      add('phonetic','韵母接龙',0,4,true,'字库外字符——无法判定');
      add('imagery','同尾相守',0,5,true,'字库外字符——无法判定');
      add('phonetic','鼻音共振',0,4,true,'字库外字符——无法判定');
    }
  }else{
    add('phonetic','声母接龙',0,4,true,'中文专属规则，跳过');
    add('phonetic','韵母接龙',0,4,true,'中文专属规则，跳过');
    add('imagery','同尾相守',0,5,true,'中文专属规则，跳过');
    add('phonetic','鼻音共振',0,4,true,'中文专属规则，跳过');
  }
  const bothSingle=A.length===1&&B.length===1;
  add('none','单字简洁派',bothSingle?3:0,3,false,
    bothSingle?'两人都是单字名——简洁有力，一个字就够了':'至少一人是多字名');

  /* --- 汇总 --- */
  const score=Math.min(99,total);
  const grp=g=>{let p=0,m=0;rows.forEach(r=>{if(r.group===g&&!r.skip){p+=r.pts;m+=r.max;}});return m?Math.round(p/m*100):50;};
  const phonetic=grp('phonetic'), imagery=grp('imagery');
  const tension=Math.max(5,Math.min(100,28+(f.overcome?32:f.generate?20:f.sameE?12:0)+f.distinct*8+(d<=1?8:0)+(f.palindrome?20:0)+(f.latinInit?10:0)));

  /* --- CP 名（取双方尾字，撞字则取首字） --- */
  let cp;
  if(sA==='latin'&&sB==='latin'){ cp=A[0].toUpperCase()+"·"+B[0].toUpperCase(); }
  else{
    const a=A[A.length-1],b=B[B.length-1];
    cp=(a.toLowerCase()!==b.toLowerCase())?(a+b):(A[0]+B[0]);
  }

  const t=tierOf(score);
  const quote=f.self?"「 磕自己也给满贯——毕竟没有人比你更懂你 😌 」":"「 "+t.quotes[score%t.quotes.length]+" 」";

  return {score,subs:[["音韵契合",phonetic],["意境缘分",imagery],["氛围张力",tension]],
    rows,total,cp,type:typeOf(f),tier:t,quote,self:f.self};
}

/* ================= UI ================= */
let toastTimer;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1800);}
function animateNum(el,target,dur){const t0=performance.now();
  (function step(t){const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(target*(1-Math.pow(1-p,3)));
  if(p<1)requestAnimationFrame(step);})(t0);}
function burstHearts(){
  const wrap=$("gaugeWrap"),em=["💗","💖","✨","💕","💫"];
  for(let i=0;i<12;i++){
    const s=document.createElement("span");
    s.className="burst";s.textContent=em[i%em.length];
    s.style.left="50%";s.style.top="45%";
    s.style.setProperty("--dx",(((i*53)%160)-80)+"px");
    s.style.animationDelay=(i*60)+"ms";
    wrap.appendChild(s);setTimeout(()=>s.remove(),2200);
  }
}
function renderRules(res){
  let html=`<div class="sum-line">基础 ${BASE} ＋ 加成 ${res.total-BASE} ＝ ${res.total}${res.total>99?'（封顶 99）':''}</div>`;
  res.rows.forEach(r=>{
    const cls=r.skip?"skip":(r.pts>0?"":"zero");
    const ico=r.skip?"?":(r.pts>0?"✓":"—");
    const pts=r.skip?"跳过":("＋"+r.pts);
    html+=`<div class="rule-row"><div class="rule-ico">${ico}</div>
      <div class="rule-body"><div class="rule-title">${esc(r.title)}</div>
      <div class="rule-desc">${esc(r.detail)}</div></div>
      <div class="rule-pts ${cls}">${pts}</div></div>`;
  });
  $("rulesList").innerHTML=html;
}

const MSGS=["正在查阅发音字典","正在比对声母韵母","正在检查五行生克","正在扫描共有字符","正在起草磕点报告"];
const BAR_COLORS=["#ff7eb3","#b38bff","#ff9d6b"];
let busy=false; const history=[];

async function analyze(){
  if(busy)return;
  const a=$("nameA").value.trim(), b=$("nameB").value.trim();
  if(!a||!b){toast("两个名字都要填上哦～");
    [$("nameA"),$("nameB")].forEach(el=>{if(!el.value.trim()){el.classList.add("shake");setTimeout(()=>el.classList.remove("shake"),450);}});
    return;}
  busy=true;const btn=$("goBtn");btn.disabled=true;btn.textContent="鉴 定 中 …";

  const res=analyzeNames(a,b);
  const result=$("result"),scan=$("scan"),verdict=$("verdict");
  result.classList.remove("hidden");verdict.classList.add("hidden");scan.classList.remove("hidden");
  result.scrollIntoView({behavior:"smooth",block:"nearest"});
  for(const m of MSGS){$("scanText").textContent=m;await sleep(430);}

  scan.classList.add("hidden");verdict.classList.remove("hidden");

  $("cpName").textContent=res.cp;
  $("cpType").textContent=" · "+res.type;
  const tierEl=$("tier");tierEl.textContent=res.tier.name;tierEl.style.color=res.tier.color;
  $("quote").textContent=res.quote;

  const top=res.rows.filter(r=>!r.skip&&r.pts>0&&r.group!=='base').sort((x,y)=>y.pts-x.pts).slice(0,2);
  $("chips").innerHTML="主要磕点："+top.map(r=>`<span>${esc(r.title)} +${r.pts}</span>`).join("");

  renderRules(res);

  const C=477.52,fill=$("gaugeFill");
  fill.style.transition="none";fill.style.strokeDashoffset=C;
  void fill.getBoundingClientRect();
  fill.style.transition="";fill.style.strokeDashoffset=C*(1-res.score/100);
  animateNum($("scoreNum"),res.score,1300);

  const fills=[...document.querySelectorAll(".bar-fill")];
  const vals=[...document.querySelectorAll(".bar-val")];
  fills.forEach(el=>{el.style.transition="none";el.style.width="0%";});
  void fills[0].offsetWidth;
  res.subs.forEach(([,v],i)=>{fills[i].style.transition="";fills[i].style.width=v+"%";
    fills[i].style.background=BAR_COLORS[i];animateNum(vals[i],v,1100);});

  if(res.score>=80)burstHearts();
  history.unshift({a,b,s:res.score});if(history.length>6)history.pop();
  $("history").innerHTML=history.map(h=>`<span class="h-chip">${esc(h.a)} × ${esc(h.b)} · <b>${h.s}</b></span>`).join("");

  btn.disabled=false;btn.textContent="开 始 鉴 定 🔍";busy=false;
}

 $("goBtn").addEventListener("click",analyze);
[$("nameA"),$("nameB")].forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter")analyze();}));
 $("againBtn").addEventListener("click",()=>{$("result").classList.add("hidden");$("nameA").focus();$("nameA").select();});
